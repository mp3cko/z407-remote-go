name: Release

# Runs whenever a semantic version tag (v1.2.3 or v1.2.3-rc.1) is pushed.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest,  goos: linux,   goarch: amd64, cgo: '0' }
          - { os: ubuntu-latest,  goos: linux,   goarch: arm64, cgo: '0' }
          - { os: windows-latest, goos: windows, goarch: amd64, cgo: '0' }
          # The macOS Bluetooth backend (CoreBluetooth) uses cgo, so macOS
          # builds must run on a Mac (arm64 runner can also target amd64).
          - { os: macos-latest,   goos: darwin,  goarch: arm64, cgo: '1' }
          - { os: macos-latest,   goos: darwin,  goarch: amd64, cgo: '1' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          name="z407_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          bin=z407
          ldflags="-s -w"
          if [ "$GOOS" = windows ]; then
            bin=z407.exe
            # GUI program: double-clicking it opens the remote's window, no console.
            ldflags="$ldflags -H=windowsgui"
          fi
          mkdir -p "dist/$name"
          go build -trimpath -ldflags="$ldflags" -o "dist/$name/$bin" ./cmd/z407
          cp LICENSE README.md "dist/$name/"
          cd dist
          if [ "$GOOS" = windows ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
            echo "ASSET=dist/$name.zip" >> "$GITHUB_ENV"
          else
            tar -czf "$name.tar.gz" "$name"
            echo "ASSET=dist/$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: z407-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=(--generate-notes --verify-tag)
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" \
            --title "$GITHUB_REF_NAME" assets/*
