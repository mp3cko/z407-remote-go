name: Release

# Runs whenever a semantic version tag (v1.2.3 or v1.2.3-rc.1) is pushed.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest,  goos: linux,   goarch: amd64, cgo: '0' }
          - { os: ubuntu-latest,  goos: linux,   goarch: arm64, cgo: '0' }
          - { os: windows-latest, goos: windows, goarch: amd64, cgo: '0' }
          # The macOS Bluetooth backend (CoreBluetooth) uses cgo, so macOS
          # builds must run on a Mac (arm64 runner can also target amd64).
          - { os: macos-latest,   goos: darwin,  goarch: arm64, cgo: '1' }
          - { os: macos-latest,   goos: darwin,  goarch: amd64, cgo: '1' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          name="z407_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          mkdir -p "dist/$name"
          if [ "$GOOS" = windows ]; then
            # z407.exe is a GUI program: it opens the remote's window and no
            # console. z407_console.exe logs to the terminal it runs in.
            go build -trimpath -ldflags="-s -w -H=windowsgui" -o "dist/$name/z407.exe" ./cmd/z407
            go build -trimpath -ldflags="-s -w" -o "dist/$name/z407_console.exe" ./cmd/z407
          elif [ "$GOOS" = darwin ]; then
            # "Z407 Remote.app" wraps the program, which gives it its icon.
            go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/z407" ./cmd/z407
            packaging/macos-app.sh "$RUNNER_TEMP/z407" "dist/$name" "$GITHUB_REF_NAME"
          else
            go build -trimpath -ldflags="-s -w" -o "dist/$name/z407" ./cmd/z407
          fi
          cp LICENSE README.md "dist/$name/"
          cd dist
          if [ "$GOOS" = windows ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
            echo "ASSET=dist/$name.zip" >> "$GITHUB_ENV"
          else
            tar -czf "$name.tar.gz" "$name"
            echo "ASSET=dist/$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: z407-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  android:
    name: build android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The release key is optional. Secrets: ANDROID_KEYSTORE_BASE64 (the
      # keystore file, base64-encoded), ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Without them the APK is
      # signed with a throwaway debug key: it installs, but cannot update
      # an APK from another release.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "Z407_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a debug key."
          fi
      - name: Test and build the APK
        working-directory: android
        env:
          Z407_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          Z407_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          Z407_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon test assembleRelease -PversionName="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/z407_${GITHUB_REF_NAME}_android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: z407-android
          path: z407_${{ github.ref_name }}_android.apk
          if-no-files-found: error

  release:
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=(--generate-notes --verify-tag)
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" \
            --title "$GITHUB_REF_NAME" assets/*
